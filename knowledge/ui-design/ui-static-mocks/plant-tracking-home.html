<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Tracking Home Screen Mockup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iPhone frame */
        .iphone-frame {
            position: relative;
            background-color: #f5f5f5;
            border-radius: 36px;
            width: 390px;
            height: 844px; /* iPhone 15 proportions */
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .iphone-frame::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 20px;
            background-color: #f5f5f5;
            border-radius: 0 0 10px 10px;
        }
        .screen-content {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: white;
            overflow-y: auto;
            padding: 20px;
        }
        /* Custom badge */
        .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <div class="screen-content">
            <!-- Status Bar -->
            <div class="flex justify-between items-center text-xs text-gray-500 mb-4">
                <div class="flex items-center space-x-1">
                    <span class="material-icons-outlined">access_time</span>
                    <span>10:41 AM</span>
                </div>
                <div class="flex items-center space-x-1">
                    <span class="material-icons-outlined">battery_std</span>
                    <span>87%</span>
                </div>
            </div>

            <!-- Header -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center space-x-2 text-xl font-bold text-emerald-600">
                    <span>🌱</span>
                    <span>Plant Tracking</span>
                </div>
                <div class="text-2xl text-gray-400 hover:text-gray-600 cursor-pointer" onclick="alert('Settings opened')">
                    <span class="material-icons-outlined">settings</span>
                </div>
            </div>

            <!-- Scan Button -->
            <div class="mb-8">
                <button onclick="activateScanner()" 
                        class="w-full bg-emerald-600 text-white py-8 px-6 rounded-3xl flex flex-col items-center justify-center shadow-lg hover:bg-emerald-700 transition-colors"
                        id="scanButton">
                    <div class="text-4xl mb-2">
                        <span class="material-icons-outlined">qr_code_scanner</span>
                    </div>
                    <div class="text-lg font-semibold">
                        Scan Plant QR Code
                    </div>
                    <div class="text-sm text-emerald-100">
                        Tap to activate camera and scan QR code
                    </div>
                    <div class="text-xs text-emerald-200 mt-1">
                        Or enter ID manually
                    </div>
                </button>
            </div>

            <!-- Action Button Row -->
            <div class="grid grid-cols-3 gap-4">
                <!-- Plant Care Button -->
                <button onclick="showAlert('Plant Care')" 
                        class="bg-white border border-gray-200 rounded-2xl p-4 flex flex-col items-center justify-center shadow hover:bg-gray-50 transition-colors relative">
                    <div class="text-2xl mb-2">🌿</div>
                    <div class="font-medium text-center">Plant Care</div>
                    <div class="badge">5</div>
                </button>
                <!-- Activity Log Button -->
                <button onclick="showAlert('Activity Log')" 
                        class="bg-white border border-gray-200 rounded-2xl p-4 flex flex-col items-center justify-center shadow hover:bg-gray-50 transition-colors">
                    <div class="text-2xl mb-2">📓</div>
                    <div class="font-medium text-center">Activity Log</div>
                </button>
                <!-- More Button -->
                <button onclick="showAlert('More Features')" 
                        class="bg-white border border-gray-200 rounded-2xl p-4 flex flex-col items-center justify-center shadow hover:bg-gray-50 transition-colors">
                    <div class="text-2xl mb-2">☰</div>
                    <div class="font-medium text-center">More</div>
                </button>
            </div>

            <!-- Optional: Bottom Navigation -->
            <div class="mt-10 pt-4 border-t border-gray-200 flex justify-around text-sm text-gray-500">
                <div onclick="showAlert('Home')" class="flex flex-col items-center">
                    <span class="material-icons-outlined">home</span>
                    <span class="mt-1">Home</span>
                </div>
                <div onclick="showAlert('Search')" class="flex flex-col items-center">
                    <span class="material-icons-outlined">search</span>
                    <span class="mt-1">Search</span>
                </div>
                <div onclick="showAlert('Stats')" class="flex flex-col items-center">
                    <span class="material-icons-outlined">insert_chart</span>
                    <span class="mt-1">Stats</span>
                </div>
                <div onclick="showAlert('Profile')" class="flex flex-col items-center">
                    <span class="material-icons-outlined">person</span>
                    <span class="mt-1">Profile</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function activateScanner() {
            // Simulate scanner activation
            document.getElementById('scanButton').innerHTML = `
                <div class="text-4xl mb-2">
                    <span class="material-icons-outlined">videocam</span>
                </div>
                <div class="text-lg font-semibold">
                    Scanning...
                </div>
                <div class="text-sm text-emerald-100">
                    Point camera at QR code
                </div>
            `;
            setTimeout(() => {
                showAlert('QR code scanned! Opening plant record...');
                // Reset button after delay
                setTimeout(() => {
                    document.getElementById('scanButton').innerHTML = `
                        <div class="text-4xl mb-2">
                            <span class="material-icons-outlined">qr_code_scanner</span>
                        </div>
                        <div class="text-lg font-semibold">
                            Scan Plant QR Code
                        </div>
                        <div class="text-sm text-emerald-100">
                            Tap to activate camera and scan QR code
                        </div>
                        <div class="text-xs text-emerald-200 mt-1">
                            Or enter ID manually
                        </div>
                    `;
                }, 1500);
            }, 2000);
        }

        function showAlert(message) {
            alert(message);
        }
    </script>
</body>
</html>
